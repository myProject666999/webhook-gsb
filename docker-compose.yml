services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U webhook
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
    - 5432:5432
  webhook:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://webhook:webhook@postgres:5432/webhook?sslmode=disable
      WORKER_CONCURRENCY: '4'
      ATTEMPT_TIMEOUT: 20s
      LEASE_DURATION: 45s
      BACKOFF_BASE: 2s
      BACKOFF_MAX: 10m
      DEFAULT_MAX_ATTEMPTS: '6'
      SIGNATURE_WINDOW: 5m
    ports:
    - 8080:8080
  receiver:
    build: .
    command:
    - receiver
    - -addr
    - :9000
    - -secret
    - demo-secret-please-change
    - -window
    - 5m
    ports:
    - 9000:9000
  tests:
    profiles:
    - test
    image: golang:1.25-alpine
    entrypoint:
    - /bin/sh
    - -c
    working_dir: /src
    command:
    - 'set -e

      apk add --no-cache git >/dev/null

      go mod download

      go test -count=1 ./...

      '
    environment:
      TEST_DATABASE_URL: postgres://webhook:webhook@postgres:5432/webhook?sslmode=disable
    volumes:
    - ./backend:/src
    - gocache:/root/.cache/go-build
    - gomod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata: null
  gocache: null
  gomod: null
